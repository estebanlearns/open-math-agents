# Fork-only scratch compiler for Phase 2 (estebanlearns/open-math-agents, branches scratch/**).
# Compiles every scratch/*.lean file against the SAME pinned toolchain, Mathlib and formal-conjectures
# as check-proof.yml, reusing the cache warmed on main. No secrets, read-only token, no upstream scripts.
name: scratch-lean
on:
  push:
    branches: ["scratch/**"]
    paths: ["scratch/**.lean", ".github/workflows/scratch-lean.yml"]
permissions:
  contents: read
concurrency:
  group: scratch-lean-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ELAN_HOME: /mnt/oma/elan
      OMA_FC: /mnt/oma/fc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            data
            scratch
      - name: Pinned formal-conjectures
        id: fc
        run: |
          sudo mkdir -p /mnt/oma && sudo chown "$(id -u):$(id -g)" /mnt/oma
          C=$(python3 -I -c 'import json;print(json.load(open("data/catalog.json"))["meta"]["upstreamCommit"])')
          echo "commit=$C" >> "$GITHUB_OUTPUT"
          git init -q "$OMA_FC" && cd "$OMA_FC"
          git remote add origin https://github.com/google-deepmind/formal-conjectures
          git fetch -q --depth 1 origin "$C" && git checkout -q FETCH_HEAD
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            /mnt/oma/elan
            /mnt/oma/fc/.lake
          key: lean-mnt-v1-${{ steps.fc.outputs.commit }}
      - name: Lean toolchain and Mathlib cache
        env:
          HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
          if [ "$HIT" = true ]; then echo "restored"; exit 0; fi
          retry() { for i in 1 2 3 4; do "$@" && return 0; sleep $((i * 20)); done; return 1; }
          if [ ! -x "$ELAN_HOME/bin/lake" ]; then
            retry curl -sSfL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
            retry sh /tmp/elan-init.sh -y --default-toolchain none
          fi
          cd "$OMA_FC" && retry "$ELAN_HOME/bin/lake" exe cache get
      - name: Compile scratch files
        run: |
          set -u
          mkdir -p out
          status=0
          for f in scratch/*.lean; do
            [ -e "$f" ] || continue
            b=$(basename "$f" .lean)
            cp "$f" "$OMA_FC/$b.lean"
            echo "=== $f ==="
            if (cd "$OMA_FC" && timeout 1800 "$ELAN_HOME/bin/lake" env lean "$b.lean") > "out/$b.log" 2>&1; then
              echo "OK" >> "out/$b.log"
            else
              status=1
              echo "FAILED" >> "out/$b.log"
            fi
            cat "out/$b.log"
            if grep -q "sorryAx" "out/$b.log"; then status=1; echo "SORRY DETECTED"; fi
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: scratch-logs
          path: out
